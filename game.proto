syntax = "proto3";
package osr;

enum MessageType {
  LOGIN = 0;
  GAME_ACTION = 2;
  TOKEN_AUTH = 3;
  SIGNUP = 4;
  WISH_PULL = 100;
  SHOP = 120;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message WishPullRequest {
  int32 user_id = 1;
  int32 pull_count = 2;
}

message ShopRequest {
  int32 user_id = 1;
  int32 item_id = 2;
  int32 quantity = 3;
}

message GameActionRequest {
  int32 user_id = 1;
  int32 choice = 2;
  int32 scenario_id = 3;
}

message TokenAuthRequest {
  string jwt_token = 1;
}

message SignupRequest {
  string username = 1;
  string password = 2;
}

// Wrapper envelope
message ClientMessage {
  MessageType type = 1;
  oneof payload {
    LoginRequest login = 2;
    WishPullRequest wish_pull = 3;
    GameActionRequest game_action = 4;
    TokenAuthRequest token_auth = 5;
    SignupRequest signup = 6;
    ShopRequest shop = 7;
  }
}

message ServerResponse {
  bool success = 1;
  string message = 2;
  int32 user_id = 3;  // returned on login/auth success
  string access_token = 4;  // returned by auth server redirect info
}
